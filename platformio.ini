; PlatformIO Project Configuration – LoRa-Ra-08-CubeCell
; Heltec CubeCell (ASR6502, ARM Cortex-M0+) – LoRa RX-Finder bei 433.775 MHz.
;
; Build:  pio run
; Flash:  pio run -t upload
; Monitor: pio device monitor -b 115200

[platformio]
src_dir = src/LoRaV4

[env:cubecell_board]
platform = heltec-cubecell
board = cubecell_board          ; HTCC-AB01
framework = arduino
monitor_speed = 115200
; LoRa-Region passend zur Frequenz (433.775 MHz)
board_build.arduino.lorawan.region = EU433
board_build.arduino.lorawan.rgb = ACTIVE
